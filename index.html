<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Kuesioner...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .loader {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader">
        <p>Sedang memuat kuesioner penelitian, mohon tunggu sebentar...</p>
    </div>

    <script>
        // 1. Masukkan Link Google Form A (Video Saja) dan Form B (Video + Proses) kamu di sini
        const linkA = "https://forms.gle/6pT2UcyRAU1YLUsR7";
        const linkB = "https://forms.gle/jYJADLWBwa8nnmac7";

        // 2. Logika Giliran (Round-Robin) menggunakan localStorage browser pengunjung
        // Ini memastikan setiap orang yang klik secara bergantian dapat Form A lalu Form B
        let lastChoice = localStorage.getItem('last_form_choice');
        let targetLink;

        if (lastChoice === 'A') {
            targetLink = linkB;
            localStorage.setItem('last_form_choice', 'B');
        } else {
            targetLink = linkA;
            localStorage.setItem('last_form_choice', 'A');
        }

        // 3. Langsung alihkan halaman secara otomatis ke Google Form terpilih
        window.location.replace(targetLink);
    </script>
</body>
</html>
